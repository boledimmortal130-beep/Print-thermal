<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thermal Print Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Pacifico&family=Orbitron:wght@700&family=Roboto+Mono&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{--card:#fff;--tx:#111827;--mu:#6b7280;--ac:#2563eb;--bd:#d1d5db;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#1f2937;--tx:#f3f4f6;--mu:#9ca3af;--bd:#374151;--ac:#3b82f6}}
:root[data-theme="dark"]{--card:#1f2937;--tx:#f3f4f6;--mu:#9ca3af;--bd:#374151;--ac:#3b82f6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:#0f172a;font:15px system-ui,sans-serif;min-height:100%}
.wrap{max-width:1000px;margin:auto;padding:12px;display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media(min-width:860px){.wrap{grid-template-columns:1fr 1fr;align-items:start}.pv{position:sticky;top:12px}.hd{grid-column:1/-1}}
.card{background:var(--card);color:var(--tx);border-radius:14px;padding:14px;box-shadow:0 2px 12px #0004}
h1{font-size:18px;margin:0 0 8px}h2{font-size:14px;margin:14px 0 0;color:var(--ac)}
label{display:block;font-size:12px;color:var(--mu);margin-top:8px}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:transparent;color:inherit;font:inherit}
input[type=range]{padding:0}input[type=color]{height:38px;padding:2px}
.ck{display:flex;align-items:center;gap:6px;color:var(--tx);font-size:14px}.ck input{width:auto}
.r{display:flex;flex-wrap:wrap;gap:4px 10px}.r>*{flex:1 1 130px}
.b{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer}
.b.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.hb{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;background:#9ca3af}.dot.ok{background:#22c55e}.dot.er{background:#ef4444}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:4px}.tabs button{white-space:nowrap;border:1px solid var(--bd);background:transparent;color:var(--tx);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.pn{display:none}.pn.on{display:block}
.paper{margin:12px auto;background:#fff;box-shadow:0 0 14px #0006;max-height:70vh;overflow:auto}
.paper canvas{width:100%;display:block}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.chip{width:38px;height:38px;border-radius:50%;border:2px solid var(--bd);cursor:pointer}
small{color:var(--mu)}
</style></head><body>
