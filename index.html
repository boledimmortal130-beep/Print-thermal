<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thermal Print Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Pacifico&family=Orbitron:wght@700&family=Roboto+Mono&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{--card:#fff;--tx:#111827;--mu:#6b7280;--ac:#2563eb;--bd:#d1d5db;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#1f2937;--tx:#f3f4f6;--mu:#9ca3af;--bd:#374151;--ac:#3b82f6}}
:root[data-theme="dark"]{--card:#1f2937;--tx:#f3f4f6;--mu:#9ca3af;--bd:#374151;--ac:#3b82f6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:#0f172a;font:15px system-ui,sans-serif;min-height:100%}
.wrap{max-width:1000px;margin:auto;padding:12px;display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media(min-width:860px){.wrap{grid-template-columns:1fr 1fr;align-items:start}.pv{position:sticky;top:12px}.hd{grid-column:1/-1}}
.card{background:var(--card);color:var(--tx);border-radius:14px;padding:14px;box-shadow:0 2px 12px #0004}
h1{font-size:18px;margin:0 0 8px}h2{font-size:14px;margin:14px 0 0;color:var(--ac)}
label{display:block;font-size:12px;color:var(--mu);margin-top:8px}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:transparent;color:inherit;font:inherit}
input[type=range]{padding:0}input[type=color]{height:38px;padding:2px}
.ck{display:flex;align-items:center;gap:6px;color:var(--tx);font-size:14px}.ck input{width:auto}
.r{display:flex;flex-wrap:wrap;gap:4px 10px}.r>*{flex:1 1 130px}
.b{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer}
.b.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.hb{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;background:#9ca3af}.dot.ok{background:#22c55e}.dot.er{background:#ef4444}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:4px}.tabs button{white-space:nowrap;border:1px solid var(--bd);background:transparent;color:var(--tx);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.pn{display:none}.pn.on{display:block}
.paper{margin:12px auto;background:#fff;box-shadow:0 0 14px #0006;max-height:70vh;overflow:auto}
.paper canvas{width:100%;display:block}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.chip{width:38px;height:38px;border-radius:50%;border:2px solid var(--bd);cursor:pointer}
small{color:var(--mu)}
</style></head><body>
<div class="wrap">
<div class="card hd"><h1>🖨️ Thermal Print Studio</h1>
<div class="hb"><button class="b" id="bc">Hubungkan Bluetooth</button><span class="dot" id="dt"></span><span id="st">Belum terhubung</span></div>
<small>Butuh Chrome/Edge (Android atau PC) dan printer thermal BLE. Jika gagal terhubung, buka halaman ini langsung di tab browser (bukan di dalam pratinjau).</small></div>

<div class="card" id="in"></div>

<div class="card pv"><h1>Preview Kertas</h1>
<div class="paper" id="pp"><canvas id="cv"></canvas></div>
<div class="hb"><button class="b" id="bp">🖨️ Cetak</button><small>Hasil cetak sama persis dengan preview.</small></div></div>

<div class="card"><h1>Pengaturan</h1>
<div class="tabs" id="tb"></div><div id="pns"></div></div>
</div>

<script>
const $=s=>document.querySelector(s);
const FONTS=['Courier New','Roboto Mono','Special Elite','Arial','Verdana','Trebuchet MS','Georgia','Times New Roman','Impact','Bebas Neue','Orbitron','Pacifico','Comic Sans MS','Brush Script MT'];
const sty=o=>Object.assign({font:'Courier New',size:22,bold:false,italic:false,up:false,align:'center',ls:0,lh:1.25,x:0,y:4},o);
const D={paper:384,feed:4,
title:sty({on:true,text:'TOKO SAYA',size:34,bold:true,y:6}),
time:sty({on:true,day:true,date:true,month:true,year:true,hm:true,sec:false,size:20}),
note:sty({on:true,text:'Terima kasih\nSelamat datang kembali!',align:'left',y:8}),
sep:sty({on:true,ch:'-',a:true,b:true,c:true,size:20,y:2}),
bg:{mode:'grad',c1:'#0f172a',c2:'#1e3a8a',ang:135,img:''}};
let S=JSON.parse(JSON.stringify(D));
try{const j=JSON.parse(localStorage.getItem('tps'));for(const k in j)S[k]=typeof j[k]=='object'?Object.assign(S[k]||{},j[k]):j[k]}catch(e){}
const save=()=>{try{const c=JSON.parse(JSON.stringify(S));c.bg.img='';localStorage.setItem('tps',JSON.stringify(c))}catch(e){}};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const G=o=>o?S[o]:S;
const SEL=(o,k,l,op)=>`<label>${l}<select data-o="${o}" data-k="${k}">${op.map(a=>`<option value="${a[0]}"${G(o)[k]==a[0]?' selected':''}>${a[1]}</option>`).join('')}</select></label>`;
const RNG=(o,k,l,mn,mx,s)=>`<label>${l}: <b id="v${o}${k}">${G(o)[k]}</b><input type="range" data-o="${o}" data-k="${k}" min="${mn}" max="${mx}" step="${s}" value="${G(o)[k]}"></label>`;
const CHK=(o,k,l)=>`<label class="ck"><input type="checkbox" data-o="${o}" data-k="${k}"${G(o)[k]?' checked':''}> ${l}</label>`;
const TXT=(o,k,l,ta)=>`<label>${l}`+(ta?`<textarea rows="4" data-o="${o}" data-k="${k}">${esc(G(o)[k])}</textarea>`:`<input data-o="${o}" data-k="${k}" value="${esc(G(o)[k])}">`)+`</label>`;
const STY=o=>SEL(o,'font','Gaya tulisan',FONTS.map(f=>[f,f]))+`<div class="r">`+RNG(o,'size','Ukuran (px)',8,90,1)+RNG(o,'ls','Jarak huruf',-2,12,.5)+RNG(o,'lh','Jarak baris',1,2.5,.05)+SEL(o,'align','Posisi teks',[['left','Kiri'],['center','Tengah'],['right','Kanan']])+RNG(o,'x','Geser horizontal',-200,200,1)+RNG(o,'y','Jarak dari atas',0,80,1)+`</div><div class="r">`+CHK(o,'bold','Tebal')+CHK(o,'italic','Miring')+CHK(o,'up','HURUF BESAR')+`</div>`;
const P=[['#0f172a','#1e3a8a'],['#111827','#7c3aed'],['#064e3b','#10b981'],['#7f1d1d','#f97316'],['#f8fafc','#cbd5e1'],['#18181b','#52525b']];

$('#in').innerHTML=`<h1>Isi Cetakan</h1>
<h2>Nama / Judul</h2>${CHK('title','on','Tampilkan judul')}${TXT('title','text','Nama / judul')}
<h2>Waktu</h2>${CHK('time','on','Tampilkan waktu')}<div class="r">${CHK('time','day','Hari')}${CHK('time','date','Tanggal')}${CHK('time','month','Bulan')}${CHK('time','year','Tahun')}${CHK('time','hm','Jam')}${CHK('time','sec','Detik')}</div>
<h2>Catatan</h2>${CHK('note','on','Tampilkan catatan')}${TXT('note','text','Catatan yang akan dicetak',1)}`;

const TABS=['Judul','Waktu','Catatan','Karakter','Latar & Kertas'];
const PN=[STY('title'),STY('time'),STY('note'),
`<small>Garis/karakter pemisah yang diulang selebar kertas.</small>${CHK('sep','on','Aktifkan karakter')}${TXT('sep','ch','Karakter (contoh: - = * ~ # ·)')}<div class="r">${CHK('sep','a','Setelah judul')}${CHK('sep','b','Setelah waktu')}${CHK('sep','c','Di akhir catatan')}</div>`+STY('sep'),
`${SEL('','paper','Lebar kertas',[[384,'58 mm (384 dot)'],[576,'80 mm (576 dot)']])}${RNG('','feed','Spasi kosong akhir (baris)',0,12,1)}
<h2>Latar belakang website</h2>${SEL('bg','mode','Jenis latar',[['color','Warna'],['grad','Gradasi'],['img','Gambar']])}
<div class="r"><label>Warna 1<input type="color" data-o="bg" data-k="c1" value="${S.bg.c1}"></label><label>Warna 2<input type="color" data-o="bg" data-k="c2" value="${S.bg.c2}"></label></div>
${RNG('bg','ang','Sudut gradasi',0,360,5)}<label>Gambar sendiri<input type="file" id="fi" accept="image/*"></label>
<div class="chips">${P.map(p=>`<button class="chip" data-c1="${p[0]}" data-c2="${p[1]}" style="background:linear-gradient(135deg,${p[0]},${p[1]})"></button>`).join('')}</div>
<p><button class="b g" id="rs">Reset semua pengaturan</button></p>`];
$('#tb').innerHTML=TABS.map((t,i)=>`<button data-t="${i}">${t}</button>`).join('');
$('#pns').innerHTML=PN.map((h,i)=>`<div class="pn" id="p${i}">${h}</div>`).join('');
function tab(i){document.querySelectorAll('#tb button').forEach((b,j)=>b.classList.toggle('on',i==j));document.querySelectorAll('.pn').forEach((p,j)=>p.classList.toggle('on',i==j))}
tab(0);
$('#tb').onclick=e=>{if(e.target.dataset.t!==undefined)tab(+e.target.dataset.t)};

function bg(){const b=S.bg,s=document.body.style;if(b.mode=='img'&&b.img)s.background=`url(${b.img}) center/cover fixed`;else if(b.mode=='grad')s.background=`linear-gradient(${b.ang}deg,${b.c1},${b.c2}) fixed`;else s.background=b.c1}

document.addEventListener('input',e=>{const t=e.target,o=t.dataset.o,k=t.dataset.k;if(k===undefined)return;const g=G(o);g[k]=t.type=='checkbox'?t.checked:typeof g[k]=='number'?+t.value:t.value;const v=$('#v'+o+k);if(v)v.textContent=t.value;if(o=='bg')bg();render();save()});
document.addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;S.bg.c1=c.dataset.c1;S.bg.c2=c.dataset.c2;S.bg.mode='grad';document.querySelector('[data-o=bg][data-k=c1]').value=S.bg.c1;document.querySelector('[data-o=bg][data-k=c2]').value=S.bg.c2;document.querySelector('[data-o=bg][data-k=mode]').value='grad';bg();save()});
$('#fi').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{S.bg.img=r.result;S.bg.mode='img';document.querySelector('[data-o=bg][data-k=mode]').value='img';bg()};r.readAsDataURL(f)};
$('#rs').onclick=()=>{try{localStorage.removeItem('tps')}catch(e){}location.reload()};

/* ===== Render kertas ===== */
const HR=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'],BL=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function ts(c){const n=new Date(),p=v=>String(v).padStart(2,'0'),d=[];if(c.date)d.push(n.getDate());if(c.month)d.push(BL[n.getMonth()]);if(c.year)d.push(n.getFullYear());let s=(c.day?HR[n.getDay()]+(d.length?', ':''):'')+d.join(' ');if(c.hm)s+=(s?' ':'')+p(n.getHours())+':'+p(n.getMinutes())+(c.sec?':'+p(n.getSeconds()):'');return s}
function wrap(x,t,w){const o=[];t.split('\n').forEach(q=>{let l='';for(const wd of q.split(' ')){const tr=l?l+' '+wd:wd;if(x.measureText(tr).width<=w){l=tr;continue}if(l){o.push(l);l=''}let c='';for(const ch of wd){if(x.measureText(c+ch).width>w&&c){o.push(c);c=ch}else c+=ch}l=c}o.push(l)});return o}
function blk(x,c,t,y,W){x.font=`${c.italic?'italic ':''}${c.bold?'bold ':''}${c.size}px "${c.font}",sans-serif`;x.letterSpacing=c.ls+'px';const M=8,mw=W-2*M,lh=c.size*c.lh;if(t===null){t='';const ch=c.ch||'-';while(x.measureText(t+ch).width<=mw&&t.length<300)t+=ch}if(c.up)t=t.toUpperCase();y+=+c.y;for(const l of wrap(x,t,mw)){const w=x.measureText(l).width-c.ls;const px=c.align=='center'?(W-w)/2:c.align=='right'?W-M-w:M;x.fillText(l,px+c.x,y);y+=lh}return y}
let cv;
function render(){const W=S.paper,c=document.createElement('canvas');c.width=W;c.height=3000;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,3000);x.fillStyle='#000';x.textBaseline='top';let y=6;const sp=f=>{if(S.sep.on&&f)y=blk(x,S.sep,null,y,W)};
if(S.title.on&&S.title.text.trim()){y=blk(x,S.title,S.title.text,y,W);sp(S.sep.a)}
if(S.time.on){const t=ts(S.time);if(t){y=blk(x,S.time,t,y,W);sp(S.sep.b)}}
if(S.note.on&&S.note.text.trim()){y=blk(x,S.note,S.note.text,y,W);sp(S.sep.c)}
y=Math.min(Math.ceil(y+10),3000);const o=$('#cv');o.width=W;o.height=y;o.getContext('2d').drawImage(c,0,0);cv=o;$('#pp').style.width=W==384?'min(100%,330px)':'min(100%,450px)'}

/* ===== Bluetooth & cetak ===== */
const SV=['000018f0-0000-1000-8000-00805f9b34fb','0000ffe0-0000-1000-8000-00805f9b34fb','0000ff00-0000-1000-8000-00805f9b34fb','e7810a71-73ae-499d-8c15-faa9aef0c3f2','49535343-fe7d-4ae5-8fa9-9fafd205e455','0000fee7-0000-1000-8000-00805f9b34fb'];
let dev,chr;
const st=(m,k)=>{$('#st').textContent=m;$('#dt').className='dot'+(k===1?' ok':k===0?' er':'')};
$('#bc').onclick=async()=>{
if(!navigator.bluetooth)return st('Browser tidak mendukung Web Bluetooth. Pakai Chrome/Edge.',0);
try{st('Mencari perangkat…');dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:SV});
dev.addEventListener('gattserverdisconnected',()=>{chr=null;st('Terputus',0)});
const sv=await dev.gatt.connect();chr=null;
for(const s of await sv.getPrimaryServices()){for(const c of await s.getCharacteristics()){if(c.properties.write||c.properties.writeWithoutResponse){chr=c;break}}if(chr)break}
if(!chr)throw Error('karakteristik tulis tidak ditemukan');st('Terhubung: '+(dev.name||'printer'),1)}catch(e){st('Gagal: '+e.message,0)}};
function bytes(){const W=cv.width,H=cv.height,d=cv.getContext('2d').getImageData(0,0,W,H).data,wb=W/8,o=[0x1b,0x40];
for(let y0=0;y0<H;y0+=200){const h=Math.min(200,H-y0);o.push(0x1d,0x76,0x30,0,wb&255,wb>>8,h&255,h>>8);
for(let y=y0;y<y0+h;y++)for(let b=0;b<wb;b++){let v=0;for(let k=0;k<8;k++){const i=(y*W+b*8+k)*4;v=v<<1|((d[i]*.3+d[i+1]*.59+d[i+2]*.11)<130?1:0)}o.push(v)}}
o.push(0x1b,0x64,S.feed);return new Uint8Array(o)}
async function send(a){for(let i=0;i<a.length;i+=100){const s=a.slice(i,i+100);if(chr.properties.writeWithoutResponse)await chr.writeValueWithoutResponse(s);else await chr.writeValue(s);await new Promise(r=>setTimeout(r,20))}}
$('#bp').onclick=async()=>{if(!chr)return st('Hubungkan printer dulu',0);try{st('Mencetak…',1);await send(bytes());st('Selesai dicetak ✓',1)}catch(e){st('Gagal cetak: '+e.message,0)}};

bg();render();
setInterval(()=>{if(S.time.on&&S.time.hm&&(S.time.sec||new Date().getSeconds()==0))render()},1000);
Promise.all(FONTS.map(f=>document.fonts.load(`20px "${f}"`).catch(()=>0))).then(render);
</script></body></html>
